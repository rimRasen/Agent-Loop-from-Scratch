[project]
name = "agent-loop"
version = "0.1.0"
description = "An agent loop written from scratch, where every run can be opened as a trace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
]

[project.scripts]
agent = "agent_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (costs money; run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]  # BLE: flags broad `except Exception`

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
